<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
    <title>ديسانا - الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f7f9fb; overscroll-behavior: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#f7f9fb] text-[#191c1e] flex flex-col min-h-screen">
    <header class="fixed top-0 w-full z-50 bg-[#f7f9fb]/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe">
        <div class="h-16 px-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="index.html" class="flex items-center gap-2">
                    <span class="text-[22px] font-bold text-[#00224e]">ديسانا</span>
                    <span class="material-symbols-outlined text-[#00224e] text-[20px]">verified</span>
                </a>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-[#00224e] flex items-center justify-center">
                    <span class="material-symbols-outlined text-white text-[18px]">person</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col relative w-full pt-16 pb-24 bg-[#f7f9fb] px-4 py-4">
        <div class="flex flex-col gap-4">
            <!-- بطاقة الترحيب -->
            <div class="bg-white rounded-xl p-4 shadow-sm">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-full bg-[#00224e] text-white flex items-center justify-center">
                            <span class="material-symbols-outlined text-[26px]">apartment</span>
                        </div>
                        <div>
                            <h1 class="text-[18px] font-bold text-[#00224e]">ديسانا العقارية</h1>
                            <span class="text-[12px] text-[#525f71]">رخصة فال للوساطة: #1200034</span>
                        </div>
                    </div>
                    <span class="text-[11px] bg-[#d3e1f6]/40 px-2 py-1 rounded-full text-[#566475]">نشط الآن</span>
                </div>
                <div class="grid grid-cols-2 gap-3 mt-4 bg-[#f2f4f6] rounded-lg p-2">
                    <div class="text-center">
                        <span class="text-[22px] font-bold text-[#00224e]" id="followerCount">12,450</span>
                        <span class="text-[11px] text-[#525f71] block">متابع</span>
                    </div>
                    <div class="text-center">
                        <span class="text-[22px] font-bold text-[#00224e]" id="propertyCount">0</span>
                        <span class="text-[11px] text-[#525f71] block">عقار موثق</span>
                    </div>
                </div>
            </div>

            <button onclick="showAddProperty()" class="w-full py-3 rounded-xl bg-[#00224e] text-white text-[14px] font-bold flex items-center justify-center gap-2 shadow-sm hover:opacity-90 transition">
                <span class="material-symbols-outlined text-[20px]">add_circle</span> + أضف إعلانك أو طلبك العقاري
            </button>

            <div id="addPropertyForm" class="hidden bg-white rounded-xl p-4 shadow-sm border border-[#e0e3e5]">
                <h3 class="text-[16px] font-bold text-[#00224e] mb-2">إضافة عقار جديد</h3>
                <input type="text" id="propTitle" placeholder="اسم العقار" class="w-full p-2 rounded-lg border border-[#e0e3e5] text-sm mb-2">
                <input type="text" id="propPrice" placeholder="السعر" class="w-full p-2 rounded-lg border border-[#e0e3e5] text-sm mb-2">
                <input type="text" id="propLocation" placeholder="الموقع" class="w-full p-2 rounded-lg border border-[#e0e3e5] text-sm mb-2">
                <textarea id="propDesc" placeholder="الوصف" class="w-full p-2 rounded-lg border border-[#e0e3e5] text-sm mb-2" rows="2"></textarea>
                <button onclick="addProperty()" class="w-full py-2 rounded-lg bg-[#00224e] text-white text-sm font-bold">💾 حفظ العقار</button>
                <button onclick="hideAddProperty()" class="w-full py-2 rounded-lg bg-[#f2f4f6] text-[#525f71] text-sm font-bold mt-2">إلغاء</button>
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-[16px] font-bold text-[#00224e]">العقارات المتاحة</h2>
                    <a href="property-details.html" class="text-[13px] text-[#00224e]">عرض الكل</a>
                </div>
                <div id="propertiesList" class="space-y-3"></div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-[16px] font-bold text-[#00224e]">العقارات المطلوبة</h2>
                    <span class="text-[12px] text-[#525f71]">طلبات نشطة</span>
                </div>
                <div id="requestsList" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full z-50 pb-safe bg-[#f7f9fb]/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,34,78,0.04)]">
        <div class="h-16 px-4 flex items-center justify-around">
            <a href="index.html" class="flex flex-col items-center justify-center gap-1 text-[#00224e] font-bold">
                <span class="material-symbols-outlined text-[24px]">real_estate_agent</span>
                <span class="text-[11px]">الرئيسية</span>
            </a>
            <a href="property-details.html" class="flex flex-col items-center justify-center gap-1 text-[#525f71] hover:text-[#00224e]">
                <span class="material-symbols-outlined text-[24px]">apartment</span>
                <span class="text-[11px]">العقارات</span>
            </a>
            <a href="appointments.html" class="flex flex-col items-center justify-center gap-1 text-[#525f71] hover:text-[#00224e]">
                <span class="material-symbols-outlined text-[24px]">calendar_month</span>
                <span class="text-[11px]">المواعيد</span>
            </a>
        </div>
    </nav>

    <script>
        // ★★★ ضع رابط Firebase الخاص بك هنا ★★★
        const firebaseConfig = {
            databaseURL: "https://desana-8246c-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function loadProperties() {
            const list = document.getElementById('propertiesList');
            db.ref('properties').on('value', (snapshot) => {
                const data = snapshot.val();
                list.innerHTML = '';
                let count = 0;
                if (data) {
                    const keys = Object.keys(data);
                    count = keys.length;
                    keys.reverse().forEach(key => {
                        const p = data[key];
                        const card = document.createElement('div');
                        card.className = 'bg-white rounded-xl p-3 shadow-sm border border-[#e0e3e5]/30';
                        card.innerHTML = `
                            <div class="flex items-center justify-between">
                                <h3 class="text-[16px] font-bold text-[#00224e]">${p.title || 'بدون عنوان'}</h3>
                                <span class="text-[14px] font-bold text-[#00224e]">${p.price || 'غير محدد'}</span>
                            </div>
                            <p class="text-[12px] text-[#525f71] mt-1">${p.location || ''} ${p.desc ? '• ' + p.desc : ''}</p>
                            <div class="flex items-center justify-between mt-2">
                                <span class="text-[11px] text-[#525f71] bg-[#f2f4f6] px-2 py-0.5 rounded">🆕 منشور</span>
                                <div class="flex gap-2">
                                    <button onclick="editProperty('${key}')" class="text-[12px] text-[#00224e] bg-[#f2f4f6] px-3 py-1 rounded-lg">✏️ تعديل</button>
                                    <button onclick="deleteProperty('${key}')" class="text-[12px] text-[#ba1a1a] bg-[#ffdad6] px-3 py-1 rounded-lg">🗑️ حذف</button>
                                </div>
                            </div>
                        `;
                        list.appendChild(card);
                    });
                }
                document.getElementById('propertyCount').textContent = count;
                if (count === 0) list.innerHTML = '<p class="text-[#525f71] text-center text-sm py-4">لا توجد عقارات حالياً. أضف عقارك الأول!</p>';
            });
        }

        function loadRequests() {
            const list = document.getElementById('requestsList');
            db.ref('requests').on('value', (snapshot) => {
                const data = snapshot.val();
                list.innerHTML = '';
                if (data) {
                    Object.keys(data).reverse().forEach(key => {
                        const r = data[key];
                        const div = document.createElement('div');
                        div.className = 'bg-white rounded-xl p-3 shadow-sm border border-[#e0e3e5]/30';
                        div.innerHTML = `
                            <div class="flex items-center justify-between">
                                <div>
                                    <h4 class="text-[14px] font-bold text-[#00224e]">${r.title || 'طلب'}</h4>
                                    <span class="text-[12px] text-[#525f71]">${r.location || ''} ${r.budget ? '• ' + r.budget : ''}</span>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="editRequest('${key}')" class="text-[12px] text-[#00224e] bg-[#f2f4f6] px-3 py-1 rounded-lg">✏️</button>
                                    <button onclick="deleteRequest('${key}')" class="text-[12px] text-[#ba1a1a] bg-[#ffdad6] px-3 py-1 rounded-lg">🗑️</button>
                                </div>
                            </div>
                        `;
                        list.appendChild(div);
                    });
                } else {
                    list.innerHTML = '<p class="text-[#525f71] text-center text-sm py-2">لا توجد طلبات حالياً.</p>';
                }
            });
        }

        function addProperty() {
            const title = document.getElementById('propTitle').value.trim();
            const price = document.getElementById('propPrice').value.trim();
            const location = document.getElementById('propLocation').value.trim();
            const desc = document.getElementById('propDesc').value.trim();
            if (!title) { alert('⚠️ الرجاء إدخال اسم العقار'); return; }
            db.ref('properties').push({ title, price, location, desc })
                .then(() => { alert('✅ تم إضافة العقار بنجاح!'); document.getElementById('propTitle').value = ''; document.getElementById('propPrice').value = ''; document.getElementById('propLocation').value = ''; document.getElementById('propDesc').value = ''; hideAddProperty(); })
                .catch(err => alert('❌ فشل الإضافة: ' + err.message));
        }

        function deleteProperty(key) {
            if (!confirm('هل أنت متأكد من حذف هذا العقار؟')) return;
            db.ref('properties/' + key).remove().then(() => alert('🗑️ تم حذف العقار بنجاح')).catch(err => alert('❌ فشل الحذف: ' + err.message));
        }

        function editProperty(key) {
            db.ref('properties/' + key).once('value', (snapshot) => {
                const p = snapshot.val();
                if (!p) return;
                document.getElementById('propTitle').value = p.title || '';
                document.getElementById('propPrice').value = p.price || '';
                document.getElementById('propLocation').value = p.location || '';
                document.getElementById('propDesc').value = p.desc || '';
                showAddProperty();
                const saveBtn = document.querySelector('#addPropertyForm button:first-of-type');
                saveBtn.textContent = '💾 تحديث العقار';
                saveBtn.onclick = function() { updateProperty(key); };
            });
        }

        function updateProperty(key) {
            const title = document.getElementById('propTitle').value.trim();
            const price = document.getElementById('propPrice').value.trim();
            const location = document.getElementById('propLocation').value.trim();
            const desc = document.getElementById('propDesc').value.trim();
            if (!title) { alert('⚠️ الرجاء إدخال اسم العقار'); return; }
            db.ref('properties/' + key).update({ title, price, location, desc })
                .then(() => { alert('✅ تم تحديث العقار بنجاح!'); document.getElementById('propTitle').value = ''; document.getElementById('propPrice').value = ''; document.getElementById('propLocation').value = ''; document.getElementById('propDesc').value = ''; hideAddProperty(); })
                .catch(err => alert('❌ فشل التحديث: ' + err.message));
        }

        function deleteRequest(key) {
            if (!confirm('هل أنت متأكد من حذف هذا الطلب؟')) return;
            db.ref('requests/' + key).remove().then(() => alert('🗑️ تم حذف الطلب بنجاح')).catch(err => alert('❌ فشل الحذف: ' + err.message));
        }

        function editRequest(key) {
            const newTitle = prompt('أدخل العنوان الجديد للطلب:');
            if (newTitle !== null && newTitle.trim() !== '') {
                db.ref('requests/' + key).update({ title: newTitle.trim() })
                    .then(() => alert('✅ تم تحديث الطلب بنجاح'))
                    .catch(err => alert('❌ فشل التحديث: ' + err.message));
            }
        }

        function showAddProperty() { document.getElementById('addPropertyForm').classList.remove('hidden'); }
        function hideAddProperty() {
            document.getElementById('addPropertyForm').classList.add('hidden');
            const saveBtn = document.querySelector('#addPropertyForm button:first-of-type');
            saveBtn.textContent = '💾 حفظ العقار';
            saveBtn.onclick = function() { addProperty(); };
        }

        loadProperties();
        loadRequests();
    </script>
</body>
</html>
