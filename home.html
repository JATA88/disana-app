<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
    <title>ديسانا - الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f7f9fb; overscroll-behavior: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        ::-webkit-scrollbar { display: none; }
        main { padding-top: 80px !important; }
        .lang-btn { transition: all 0.2s; cursor: pointer; padding: 6px 14px; border-radius: 50px; border: 1px solid #e0e3e5; background: white; font-size: 13px; }
        .lang-btn:hover { background: #00224e; color: white; border-color: #00224e; }
        [dir="ltr"] .lang-btn { margin-right: 8px; }
        .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-right: 4px solid #00224e; display: flex; justify-content: space-between; align-items: center; }
        .btn-sm { padding: 4px 12px; border-radius: 6px; font-size: 12px; border: none; cursor: pointer; }
        .btn-edit { background: #f2f4f6; color: #00224e; }
        .btn-delete { background: #ffdad6; color: #ba1a1a; }
        .flex-gap { display: flex; gap: 6px; }
        .form-box { background: white; border-radius: 12px; padding: 16px; margin: 12px 0; border: 1px solid #e0e3e5; display: none; }
        .form-box input, .form-box textarea { width: 100%; padding: 10px; border: 1px solid #e0e3e5; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
        .btn-primary { background: #00224e; color: white; border: none; padding: 12px; border-radius: 12px; font-size: 16px; width: 100%; cursor: pointer; font-weight: 700; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-save { background: #00224e; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: 700; }
        .btn-cancel { background: #f2f4f6; color: #525f71; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 6px; cursor: pointer; }
        .stat-number { font-size: 22px; font-weight: 700; color: #00224e; }
        .stat-label { font-size: 11px; color: #525f71; display: block; }
        .card-title { font-weight: 700; color: #00224e; font-size: 15px; }
        .card-sub { font-size: 13px; color: #525f71; }
        .card-desc { font-size: 12px; color: #888; }
    </style>
</head>
<body class="bg-[#f7f9fb] text-[#191c1e] flex flex-col min-h-screen">
    <header class="fixed top-0 w-full z-50 bg-[#f7f9fb]/95 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe">
        <div class="h-16 px-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="index.html" class="flex items-center gap-2">
                    <span class="text-[22px] font-bold text-[#00224e]">ديسانا</span>
                    <span class="material-symbols-outlined text-[#00224e] text-[20px]">verified</span>
                </a>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleLanguage()" class="lang-btn" id="langToggleBtn">English</button>
                <div class="w-8 h-8 rounded-full bg-[#00224e] flex items-center justify-center">
                    <span class="material-symbols-outlined text-white text-[18px]">person</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col relative w-full pb-24 bg-[#f7f9fb] px-4 py-4">
        <div class="flex flex-col gap-4">
            <!-- بطاقة الترحيب -->
            <div class="bg-white rounded-xl p-4 shadow-sm">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-full bg-[#00224e] text-white flex items-center justify-center">
                            <span class="material-symbols-outlined text-[26px]">apartment</span>
                        </div>
                        <div>
                            <h1 class="text-[18px] font-bold text-[#00224e]" id="brandName">ديسانا العقارية</h1>
                            <span class="text-[12px] text-[#525f71]" id="licenseText">رخصة فال للوساطة: #1200034</span>
                        </div>
                    </div>
                    <span class="text-[11px] bg-[#d3e1f6]/40 px-2 py-1 rounded-full text-[#566475]" id="activeStatus">نشط الآن</span>
                </div>
                <div class="grid grid-cols-2 gap-3 mt-4 bg-[#f2f4f6] rounded-lg p-2">
                    <div class="text-center">
                        <span class="stat-number" id="followerCount">12,450</span>
                        <span class="stat-label" id="followerLabel">متابع</span>
                    </div>
                    <div class="text-center">
                        <span class="stat-number" id="propertyCount">0</span>
                        <span class="stat-label" id="propertyLabel">عقار موثق</span>
                    </div>
                </div>
            </div>

            <!-- زر إضافة عقار -->
            <button onclick="showAddProperty()" class="btn-primary" id="addBtn">➕ أضف إعلانك أو طلبك العقاري</button>

            <!-- نموذج إضافة عقار -->
            <div id="addPropertyForm" class="form-box">
                <h3 id="formTitle">إضافة عقار جديد</h3>
                <input type="text" id="propTitle" placeholder="اسم العقار">
                <input type="text" id="propPrice" placeholder="السعر">
                <input type="text" id="propLocation" placeholder="الموقع">
                <textarea id="propDesc" placeholder="الوصف" rows="2"></textarea>
                <button class="btn-save" id="saveBtn" onclick="saveProperty()">💾 حفظ العقار</button>
                <button class="btn-cancel" onclick="hideAddProperty()">إلغاء</button>
            </div>

            <!-- قائمة العقارات -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-[16px] font-bold text-[#00224e]" id="propertiesTitle">العقارات المتاحة</h2>
                    <a href="property-details.html" class="text-[13px] text-[#00224e]" id="viewAllLink">عرض الكل</a>
                </div>
                <div id="propertiesList"></div>
            </div>

            <!-- قائمة الطلبات -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-[16px] font-bold text-[#00224e]" id="requestsTitle">العقارات المطلوبة</h2>
                    <span class="text-[12px] text-[#525f71]" id="requestsCount">طلبات نشطة</span>
                </div>
                <div id="requestsList"></div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full z-50 pb-safe bg-[#f7f9fb]/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,34,78,0.04)]">
        <div class="h-16 px-4 flex items-center justify-around">
            <a href="index.html" class="flex flex-col items-center justify-center gap-1 text-[#00224e] font-bold">
                <span class="material-symbols-outlined text-[24px]">real_estate_agent</span>
                <span class="text-[11px]" id="navHome">الرئيسية</span>
            </a>
            <a href="property-details.html" class="flex flex-col items-center justify-center gap-1 text-[#525f71] hover:text-[#00224e]">
                <span class="material-symbols-outlined text-[24px]">apartment</span>
                <span class="text-[11px]" id="navProperties">العقارات</span>
            </a>
            <a href="appointments.html" class="flex flex-col items-center justify-center gap-1 text-[#525f71] hover:text-[#00224e]">
                <span class="material-symbols-outlined text-[24px]">calendar_month</span>
                <span class="text-[11px]" id="navAppointments">المواعيد</span>
            </a>
        </div>
    </nav>

    <script>
        // Firebase Config
        const firebaseConfig = {
            databaseURL: "https://desana-8246c-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // الترجمة
        const translations = {
            ar: {
                brandName: 'ديسانا العقارية',
                licenseText: 'رخصة فال للوساطة: #1200034',
                activeStatus: 'نشط الآن',
                followerLabel: 'متابع',
                propertyLabel: 'عقار موثق',
                addBtn: '+ أضف إعلانك أو طلبك العقاري',
                formTitle: 'إضافة عقار جديد',
                saveBtn: '💾 حفظ العقار',
                cancelBtn: 'إلغاء',
                propertiesTitle: 'العقارات المتاحة',
                viewAllLink: 'عرض الكل',
                requestsTitle: 'العقارات المطلوبة',
                requestsCount: 'طلبات نشطة',
                navHome: 'الرئيسية',
                navProperties: 'العقارات',
                navAppointments: 'المواعيد',
                noProperties: 'لا توجد عقارات حالياً. أضف عقارك الأول!',
                noRequests: 'لا توجد طلبات حالياً.',
                btnLang: 'English',
                edit: 'تعديل',
                delete: 'حذف',
                confirmDelete: 'هل أنت متأكد من الحذف؟'
            },
            en: {
                brandName: 'Disana Real Estate',
                licenseText: 'Fal Brokerage License: #1200034',
                activeStatus: 'Live',
                followerLabel: 'Followers',
                propertyLabel: 'Properties',
                addBtn: '+ Add your property or request',
                formTitle: 'Add New Property',
                saveBtn: '💾 Save Property',
                cancelBtn: 'Cancel',
                propertiesTitle: 'Available Properties',
                viewAllLink: 'View All',
                requestsTitle: 'Property Requests',
                requestsCount: 'Active Requests',
                navHome: 'Home',
                navProperties: 'Properties',
                navAppointments: 'Appointments',
                noProperties: 'No properties yet. Add your first property!',
                noRequests: 'No requests yet.',
                btnLang: 'عربي',
                edit: 'Edit',
                delete: 'Delete',
                confirmDelete: 'Are you sure you want to delete?'
            }
        };

        let currentLang = localStorage.getItem('disana_lang') || 'ar';
        let editingKey = null;

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('disana_lang', lang);
            const t = translations[lang];
            document.getElementById('brandName').textContent = t.brandName;
            document.getElementById('licenseText').textContent = t.licenseText;
            document.getElementById('activeStatus').textContent = t.activeStatus;
            document.getElementById('followerLabel').textContent = t.followerLabel;
            document.getElementById('propertyLabel').textContent = t.propertyLabel;
            document.getElementById('addBtn').textContent = t.addBtn;
            document.getElementById('formTitle').textContent = t.formTitle;
            document.getElementById('saveBtn').textContent = t.saveBtn;
            document.getElementById('cancelBtn').textContent = t.cancelBtn;
            document.getElementById('propertiesTitle').textContent = t.propertiesTitle;
            document.getElementById('viewAllLink').textContent = t.viewAllLink;
            document.getElementById('requestsTitle').textContent = t.requestsTitle;
            document.getElementById('requestsCount').textContent = t.requestsCount;
            document.getElementById('navHome').textContent = t.navHome;
            document.getElementById('navProperties').textContent = t.navProperties;
            document.getElementById('navAppointments').textContent = t.navAppointments;
            document.getElementById('langToggleBtn').textContent = t.btnLang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            loadProperties();
            loadRequests();
        }

        function toggleLanguage() {
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            setLanguage(newLang);
        }

        // تحميل العقارات
        function loadProperties() {
            const container = document.getElementById('propertiesList');
            db.ref('properties').on('value', (snapshot) => {
                const data = snapshot.val();
                container.innerHTML = '';
                let count = 0;
                if (data) {
                    const keys = Object.keys(data);
                    count = keys.length;
                    keys.reverse().forEach(key => {
                        const item = data[key];
                        container.innerHTML += `
                            <div class="card">
                                <div>
                                    <div class="card-title">${item.title || 'بدون عنوان'}</div>
                                    <div class="card-sub">${item.price ? '💰 ' + item.price : ''} ${item.location ? '📍 ' + item.location : ''}</div>
                                    <div class="card-desc">${item.desc || ''}</div>
                                </div>
                                <div class="flex-gap">
                                    <button class="btn-sm btn-edit" onclick="editProperty('${key}')">${translations[currentLang].edit}</button>
                                    <button class="btn-sm btn-delete" onclick="deleteProperty('${key}')">${translations[currentLang].delete}</button>
                                </div>
                            </div>
                        `;
                    });
                }
                document.getElementById('propertyCount').textContent = count;
                if (count === 0) {
                    container.innerHTML = <p class="text-[#525f71] text-center text-sm py-4">${translations[currentLang].noProperties}</p>;
                }
            });
        }

        // تحميل الطلبات
        function loadRequests() {
            const container = document.getElementById('requestsList');
            db.ref('requests').on('value', (snapshot) => {
                const data = snapshot.val();
                container.innerHTML = '';
                if (data) {
                    Object.keys(data).reverse().forEach(key => {
                        const item = data[key];
                        container.innerHTML += `
                            <div class="card" style="border-right-color: #ffc107;">
                                <div>
                                    <div class="card-title">${item.title || 'طلب'}</div>
                                    <div class="card-sub">${item.budget ? '💰 ' + item.budget : ''} ${item.location ? '📍 ' + item.location : ''}</div>
                                    <div class="card-desc">${item.desc || ''}</div>
                                </div>
                                <div class="flex-gap">
                                    <button class="btn-sm btn-edit" onclick="editRequest('${key}')">${translations[currentLang].edit}</button>
                                    <button class="btn-sm btn-delete" onclick="deleteRequest('${key}')">${translations[currentLang].delete}</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = <p class="text-[#525f71] text-center text-sm py-2">${translations[currentLang].noRequests}</p>;
                }
            });
        }

        // إضافة عقار
        function saveProperty() {
            const title = document.getElementById('propTitle').value.trim();
            const price = document.getElementById('propPrice').value.trim();
            const location = document.getElementById('propLocation').value.trim();
            const desc = document.getElementById('propDesc').value.trim();
            if (!title) {
                alert(currentLang === 'ar' ? '⚠️ الرجاء إدخال اسم العقار' : '⚠️ Please enter property name');
                return;
            }
            const data = { title, price, location, desc };
            
            if (editingKey) {
                db.ref('properties/' + editingKey).update(data).then(() => {
                    alert(currentLang === 'ar' ? '✅ تم تحديث العقار' : '✅ Property updated');
                    resetPropertyForm();
                }).catch(err => alert('❌ ' + err.message));
            } else {
                db.ref('properties').push(data).then(() => {
                    alert(currentLang === 'ar' ? '✅ تم إضافة العقار بنجاح!' : '✅ Property added!');
                    resetPropertyForm();
                }).catch(err => alert('❌ ' + err.message));
            }
        }

        // تعديل عقار
        function editProperty(key) {
            db.ref('properties/' + key).once('value', snap => {
                const item = snap.val();
                if (!item) return;
                showAddProperty();
                editingKey = key;
                document.getElementById('propTitle').value = item.title || '';
                document.getElementById('propPrice').value = item.price || '';
                document.getElementById('propLocation').value = item.location || '';
                document.getElementById('propDesc').value = item.desc || '';
                document.getElementById('saveBtn').textContent = currentLang === 'ar' ? '💾 تحديث العقار' : '💾 Update';
            });
        }

        // حذف عقار
        function deleteProperty(key) {
            if (!confirm(translations[currentLang].confirmDelete)) return;
            db.ref('properties/' + key).remove().then(() => {
                alert(currentLang === 'ar' ? '🗑️ تم حذف العقار' : '🗑️ Property deleted');
            }).catch(err => alert('❌ ' + err.message));
        }

        // تعديل طلب
        function editRequest(key) {
            const newTitle = prompt(currentLang === 'ar' ? 'أدخل العنوان الجديد للطلب:' : 'Enter new request title:');
            if (newTitle && newTitle.trim() !== '') {
                db.ref('requests/' + key).update({ title: newTitle.trim() }).then(() => {
                    alert(currentLang === 'ar' ? '✅ تم تحديث الطلب' : '✅ Request updated');
                }).catch(err => alert('❌ ' + err.message));
            }
        }

        // حذف طلب
        function deleteRequest(key) {
            if (!confirm(translations[currentLang].confirmDelete)) return;
            db.ref('requests/' + key).remove().then(() => {
                alert(currentLang === 'ar' ? '🗑️ تم حذف الطلب' : '🗑️ Request deleted');
            }).catch(err => alert('❌ ' + err.message));
        }

        // إظهار/إخفاء نموذج العقار
        function showAddProperty() {
            document.getElementById('addPropertyForm').style.display = 'block';
        }
        function hideAddProperty() {
            resetPropertyForm();
            document.getElementById('addPropertyForm').style.display = 'none';
        }
        function resetPropertyForm() {
            document.getElementById('propTitle').value = '';
            document.getElementById('propPrice').value = '';
            document.getElementById('propLocation').value = '';
            document.getElementById('propDesc').value = '';
            document.getElementById('saveBtn').textContent = translations[currentLang].saveBtn;
            editingKey = null;
        }

        setLanguage(currentLang);
        loadProperties();
        loadRequests();
    </script>
</body>
</html>
