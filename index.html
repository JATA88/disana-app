<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ديسانا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body class="p-4 bg-gray-100">
    <h1 class="text-xl font-bold text-center mb-4">🏢 ديسانا</h1>
    
    <button onclick="test()" class="bg-blue-600 text-white p-2 rounded w-full mb-4">🔘 اختبار</button>
    <div id="result" class="text-center text-green-600"></div>

    <button onclick="addProperty()" class="bg-green-600 text-white p-2 rounded w-full mt-4">➕ إضافة عقار</button>
    <div id="list" class="mt-4"></div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAR0p1LvMZtLyx7IvhzFUniaeAGV76KKzE",
            authDomain: "desana-8246c.firebaseapp.com",
            databaseURL: "https://desana-8246c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "desana-8246c",
            storageBucket: "desana-8246c.firebasestorage.app",
            messagingSenderId: "572995342266",
            appId: "1:572995342266:web:671fd342c3334248b45783"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function test() {
            document.getElementById('result').textContent = '✅ JavaScript يعمل!';
        }

        function addProperty() {
            const title = prompt('اسم العقار:');
            if (!title) return;
            db.ref('properties').push({ title }).then(() => {
                alert('✅ تم الإضافة');
                loadProperties();
            }).catch(err => alert('❌ خطأ: ' + err.message));
        }

        function loadProperties() {
            const list = document.getElementById('list');
            db.ref('properties').on('value', snap => {
                const data = snap.val();
                list.innerHTML = '';
                if (!data) { list.innerHTML = '<p class="text-gray-500">لا توجد عقارات</p>'; return; }
                for (const key in data) {
                    const item = data[key];
                    list.innerHTML += `<div class="bg-white p-2 rounded shadow mb-2 flex justify-between">
                        <span>${item.title}</span>
                        <button onclick="deleteProperty('${key}')" class="text-red-500">🗑️</button>
                    </div>`;
                }
            });
        }

        function deleteProperty(key) {
            if (!confirm('حذف؟')) return;
            db.ref('properties/' + key).remove().then(() => {
                alert('🗑️ تم الحذف');
            }).catch(err => alert('❌ خطأ: ' + err.message));
        }

        loadProperties();
    </script>
</body>
</html>
