<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
    <title>تفاصيل العقار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f7f9fb; overscroll-behavior: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        ::-webkit-scrollbar { display: none; }
        main { padding-top: 80px !important; }
        .lang-btn { transition: all 0.2s; cursor: pointer; padding: 6px 14px; border-radius: 50px; border: 1px solid #e0e3e5; background: white; font-size: 13px; }
        .lang-btn:hover { background: #00224e; color: white; border-color: #00224e; }
        [dir="ltr"] .lang-btn { margin-right: 8px; }
    </style>
</head>
<body class="bg-[#f7f9fb] text-[#191c1e] flex flex-col min-h-screen">
    <header class="fixed top-0 w-full z-50 bg-[#f7f9fb]/95 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe">
        <div class="h-16 px-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="index.html" aria-label="رجوع" class="w-11 h-11 flex items-center justify-center text-[#00224e] rounded-full hover:bg-[#eceef0] transition-colors">
                    <span class="material-symbols-outlined text-[24px]">arrow_forward</span>
                </a>
                <h1 class="text-[18px] font-bold text-[#191c1e]" id="pageTitle">تفاصيل العقار</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleLanguage()" class="lang-btn" id="langToggleBtn">English</button>
                <div class="w-8 h-8 rounded-full bg-[#00224e] flex items-center justify-center">
                    <span class="material-symbols-outlined text-white text-[18px]">person</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col relative w-full pb-24 bg-[#f7f9fb] px-4 py-4">
        <div class="flex flex-col gap-4 items-center justify-center min-h-[60vh]">
            <span class="material-symbols-outlined text-[64px] text-[#525f71]">architecture</span>
            <h2 class="text-[20px] font-bold text-[#00224e]" id="emptyTitle">لم يتم اختيار عقار</h2>
            <p class="text-[14px] text-[#525f71] text-center max-w-sm" id="emptyDesc">يمكنك تصفح العقارات من الصفحة الرئيسية واختيار العقار المناسب لعرض التفاصيل</p>
            <div class="flex gap-3 mt-4">
                <a href="home.html" class="px-6 py-3 bg-[#00224e] text-white rounded-xl font-bold">🏠 العودة للرئيسية</a>
                <a href="home.html" class="px-6 py-3 bg-[#f2f4f6] text-[#00224e] rounded-xl font-bold">➕ إضافة عقار</a>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full z-50 pb-safe bg-[#f7f9fb]/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,34,78,0.04)]">
        <div class="h-16 px-4 flex items-center justify-around">
            <a href="index.html" class="flex flex-col items-center justify-center gap-1 text-[#525f71] hover:text-[#00224e]">
                <span class="material-symbols-outlined text-[24px]">real_estate_agent</span>
                <span class="text-[11px]" id="navHome">الرئيسية</span>
            </a>
            <a href="property-details.html" class="flex flex-col items-center justify-center gap-1 text-[#00224e] font-bold">
                <span class="material-symbols-outlined text-[24px]">apartment</span>
                <span class="text-[11px]" id="navProperties">العقارات</span>
            </a>
            <a href="appointments.html" class="flex flex-col items-center justify-center gap-1 text-[#525f71] hover:text-[#00224e]">
                <span class="material-symbols-outlined text-[24px]">calendar_month</span>
                <span class="text-[11px]" id="navAppointments">المواعيد</span>
            </a>
        </div>
    </nav>

    <script>
        const translations = {
            ar: {
                pageTitle: 'تفاصيل العقار',
                emptyTitle: 'لم يتم اختيار عقار',
                emptyDesc: 'يمكنك تصفح العقارات من الصفحة الرئيسية واختيار العقار المناسب لعرض التفاصيل',
                navHome: 'الرئيسية',
                navProperties: 'العقارات',
                navAppointments: 'المواعيد',
                btnLang: 'English'
            },
            en: {
                pageTitle: 'Property Details',
                emptyTitle: 'No property selected',
                emptyDesc: 'Browse properties from the home page and select one to view details',
                navHome: 'Home',
                navProperties: 'Properties',
                navAppointments: 'Appointments',
                btnLang: 'عربي'
            }
        };

        let currentLang = localStorage.getItem('disana_lang') || 'ar';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('disana_lang', lang);
            const t = translations[lang];
            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('emptyTitle').textContent = t.emptyTitle;
            document.getElementById('emptyDesc').textContent = t.emptyDesc;
            document.getElementById('navHome').textContent = t.navHome;
            document.getElementById('navProperties').textContent = t.navProperties;
            document.getElementById('navAppointments').textContent = t.navAppointments;
            document.getElementById('langToggleBtn').textContent = t.btnLang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
        }

        function toggleLanguage() {
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            setLanguage(newLang);
        }

        setLanguage(currentLang);
    </script>
</body>
</html>
