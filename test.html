<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body style="font-family: Arial; padding: 20px; text-align: center;">
    <h1>🧪 اختبار الاتصال بـ Firebase</h1>
    <button onclick="testConnection()" style="padding: 12px 24px; background: #00224e; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">🔘 اختبر Firebase</button>
    <div id="result" style="margin-top: 20px; font-size: 18px;"></div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://desana-8246c-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function testConnection() {
            const result = document.getElementById('result');
            result.innerHTML = '⏳ جاري الاتصال...';

            db.ref('test').set({
                message: '✅ Firebase يعمل!',
                time: new Date().toLocaleString()
            })
            .then(() => {
                result.innerHTML = '✅ ✅ ✅ تم الاتصال بنجاح!';
                return db.ref('test').once('value');
            })
            .then(snapshot => {
                const data = snapshot.val();
                result.innerHTML += <br><br>📦 البيانات:<br><pre style="background:#f0f0f0;padding:10px;border-radius:8px;text-align:left;display:inline-block;">${JSON.stringify(data, null, 2)}</pre>;
            })
            .catch(error => {
                result.innerHTML = '❌ فشل الاتصال: ' + error.message;
                console.error(error);
            });
        }
    </script>
</body>
</html>
